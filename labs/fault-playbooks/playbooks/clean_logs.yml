---
- name: Clean oversized demo logs
  hosts: all
  become: true
  gather_facts: false
  vars:
    lab_script_path: "{{ lab_script_path | default('/opt/auto-healing-fault-lab/auto_healing_fault_lab.sh') }}"
    lab_log_dir: "{{ lab_log_dir | default('/opt/auto-healing-fault-lab/logs') }}"
    recovery_report_dir: "{{ recovery_report_dir | default('/opt/auto-healing-fault-lab/reports') }}"
    log_safe_bytes: "{{ log_safe_bytes | default(1048576) }}"
  tasks:
    - name: Capture log status before cleanup
      ansible.builtin.command: "{{ lab_script_path }} status clean_logs"
      register: log_status_before
      changed_when: false

    - name: Read log directory size before cleanup
      ansible.builtin.command: "du -sb {{ lab_log_dir }}"
      register: log_size_before
      changed_when: false
      failed_when: false

    - name: Reset clean logs scenario
      ansible.builtin.command: "{{ lab_script_path }} reset clean_logs"
      register: clean_logs_reset
      changed_when: true

    - name: Read log directory size after cleanup
      ansible.builtin.command: "du -sb {{ lab_log_dir }}"
      register: log_size_after
      changed_when: false

    - name: Capture log status after cleanup
      ansible.builtin.command: "{{ lab_script_path }} status clean_logs"
      register: log_status_after
      changed_when: false

    - name: Verify logs are below safe threshold
      ansible.builtin.assert:
        that:
          - "'clean_logs=healthy' in log_status_after.stdout"
          - (log_size_after.stdout.split()[0] | int) < (log_safe_bytes | int)
        fail_msg: "日志清理后仍超过安全阈值"

    - name: Write cleanup report
      ansible.builtin.copy:
        dest: "{{ recovery_report_dir }}/latest-clean-logs.txt"
        mode: '0644'
        content: |
          [scenario]
          clean_logs

          [before]
          {{ log_status_before.stdout | trim }}
          {{ log_size_before.stdout | default('') | trim }}

          [action]
          {{ clean_logs_reset.stdout | trim }}

          [after]
          {{ log_status_after.stdout | trim }}
          {{ log_size_after.stdout | trim }}
